name: invoice-ninja-production
region: sgp1

# Use existing managed MySQL database
databases:
  - name: dbaas-db-9899155
    engine: MYSQL
    production: true
    cluster_name: dbaas-db-9899155

# Main web service
services:
  - name: web
    github:
      repo: 88kbbq/invoiceninja
      branch: production
      deploy_on_push: true

    # Build command - install dependencies and build assets
    build_command: |
      echo "=== Starting build ==="
      composer install --no-dev --optimize-autoloader --no-interaction
      npm ci --production
      npm run build
      echo "=== Build complete ==="

    # Run command - create .env referencing environment variables, run migrations, start server
    # Note: Environment variables are available at runtime, not during build
    run_command: |
      echo "Creating .env file..."
      : > .env
      echo "DEBUG: Normalising database credentials..."
      # DigitalOcean attachments may expose credentials under multiple prefixes
      if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "" ]; then
        if [ -n "$DATABASE_HOST" ]; then
          export DB_HOST="$DATABASE_HOST"
          echo "DEBUG: Mapped DATABASE_HOST -> DB_HOST"
        elif [ -n "$MYSQL_HOST" ]; then
          export DB_HOST="$MYSQL_HOST"
          echo "DEBUG: Mapped MYSQL_HOST -> DB_HOST"
        fi
      fi
      if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "" ]; then
        if [ -n "$DATABASE_PORT" ]; then
          export DB_PORT="$DATABASE_PORT"
          echo "DEBUG: Mapped DATABASE_PORT -> DB_PORT"
        elif [ -n "$MYSQL_PORT" ]; then
          export DB_PORT="$MYSQL_PORT"
          echo "DEBUG: Mapped MYSQL_PORT -> DB_PORT"
        fi
      fi
      if [ -z "$DB_DATABASE" ] || [ "$DB_DATABASE" = "" ]; then
        if [ -n "$DATABASE_NAME" ]; then
          export DB_DATABASE="$DATABASE_NAME"
          echo "DEBUG: Mapped DATABASE_NAME -> DB_DATABASE"
        elif [ -n "$MYSQL_DATABASE" ]; then
          export DB_DATABASE="$MYSQL_DATABASE"
          echo "DEBUG: Mapped MYSQL_DATABASE -> DB_DATABASE"
        fi
      fi
      if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "" ]; then
        if [ -n "$DATABASE_USER" ]; then
          export DB_USERNAME="$DATABASE_USER"
          echo "DEBUG: Mapped DATABASE_USER -> DB_USERNAME"
        elif [ -n "$MYSQL_USER" ]; then
          export DB_USERNAME="$MYSQL_USER"
          echo "DEBUG: Mapped MYSQL_USER -> DB_USERNAME"
        fi
      fi
      if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "" ]; then
        if [ -n "$DATABASE_PASSWORD" ]; then
          export DB_PASSWORD="$DATABASE_PASSWORD"
          echo "DEBUG: Mapped DATABASE_PASSWORD -> DB_PASSWORD"
        elif [ -n "$MYSQL_PASSWORD" ]; then
          export DB_PASSWORD="$MYSQL_PASSWORD"
          echo "DEBUG: Mapped MYSQL_PASSWORD -> DB_PASSWORD"
        elif [ -n "$DATABASE_URL" ]; then
          export DB_PASSWORD=$(php -r 'echo parse_url(getenv("DATABASE_URL"), PHP_URL_PASS);')
          if [ -n "$DB_PASSWORD" ]; then
            echo "DEBUG: Extracted DB_PASSWORD from DATABASE_URL"
          fi
        fi
      fi
      if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "" ]; then
        echo "ERROR: DB_PASSWORD is not available; aborting startup."
        exit 1
      fi
      env | grep -E '^(APP_|DB_|MYSQL_|CACHE_|SESSION_|QUEUE_|LOG_|BROADCAST_|REQUIRE_|PDF_|KITCHEN_|CLOUDPRNT_|MAIL_|FORCE_|TRUSTED_|ASSET_)' | while IFS='=' read -r key value; do
        # Properly quote values that contain spaces or special characters
        if [[ "$value" =~ [[:space:]] ]] || [[ "$value" =~ [\"\'\`\$] ]]; then
          echo "$key=\"$value\"" >> .env
        else
          echo "$key=$value" >> .env
        fi
      done
      echo ".env file created with $(wc -l < .env) variables"
      echo "DEBUG: Verifying DB_PASSWORD is in .env..."
      if ! grep -q '^DB_PASSWORD=' .env; then
        echo "ERROR: DB_PASSWORD still missing from .env; aborting."
        exit 1
      fi
      php artisan module:enable KitchenPrinter || true
      php artisan config:clear
      php artisan cache:clear
      php artisan view:clear
      php artisan route:clear
      composer dump-autoload
      exec heroku-php-nginx -C nginx.conf public/

    environment_slug: php
    instance_count: 1
    instance_size_slug: professional-xs

    http_port: 8080

    routes:
      - path: /

    health_check:
      http_path: /
      initial_delay_seconds: 90
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables (set sensitive ones via dashboard)
    envs:
      - key: APP_NAME
        value: "Invoice Ninja"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Database connection (matches old server configuration)
      # NOTE: DB_PASSWORD must be set via Digital Ocean dashboard as encrypted secret
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "dbaas-db-9899155-do-user-80331-0.b.db.ondigitalocean.com"
      - key: DB_PORT
        value: "25060"
      - key: DB_DATABASE
        value: "ninjadb3"
      - key: DB_USERNAME
        value: "ninjauser"
      # DB_PASSWORD set in Digital Ocean dashboard (ninjauser password)
      - key: MYSQL_ATTR_SSL_CA
        value: "/etc/ssl/certs/ca-certificates.crt"

      # Application keys (REQUIRED)
      - key: APP_KEY
        value: "base64:CoF/MqZAQJGQQFdJs7YZG5G+I9Ejd2wPe5h7L7VrvKA="
        type: SECRET
      - key: APP_URL
        value: "https://invoice-ninja-production-f3dqj.ondigitalocean.app"

      # Kitchen Printer Module (Star mC-Print3)
      - key: KITCHEN_PRINTER_ENABLED
        value: "true"
      - key: CLOUDPRNT_URL
        value: "http://192.168.50.39:8080/CloudPRNT"
      - key: CLOUDPRNT_MAC
        value: "00:11:62:33:9A:46"
      - key: KITCHEN_PRINT_TEMPLATE
        value: "kitchen"

      # Cache and session configuration
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "720"
      - key: QUEUE_CONNECTION
        value: sync

      # Invoice Ninja configuration
      - key: NINJA_ENVIRONMENT
        value: selfhost
      - key: MULTI_DB_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "false"

      # Laravel specific
      - key: LOG_CHANNEL
        value: stack
      - key: BROADCAST_DRIVER
        value: log

      # Invoice Ninja specific
      - key: REQUIRE_HTTPS
        value: "false"
      - key: PDF_GENERATOR
        value: snappdf

      # Force HTTPS URLs (fixes mixed content errors)
      - key: ASSET_URL
        value: "https://invoice-ninja-production-f3dqj.ondigitalocean.app"
      - key: FORCE_HTTPS
        value: "false"
      - key: TRUSTED_PROXIES
        value: "*"

# Note: Set these via Digital Ocean dashboard:
# - APP_KEY (generate with: php artisan key:generate --show)
# - APP_URL (your domain or DO app URL)
# - MAIL_* variables
# - Any other production secrets
