name: invoice-ninja-production
region: sgp1

# Use existing managed MySQL database
databases:
  - name: dbaas-db-9899155
    engine: MYSQL
    production: true
    cluster_name: dbaas-db-9899155

# Main web service
services:
  - name: web
    github:
      repo: 88kbbq/invoiceninja
      branch: production
      deploy_on_push: true

    # Build command - install dependencies and build assets
    build_command: |
      echo "=== Starting build ==="
      composer install --no-dev --optimize-autoloader --no-interaction
      npm ci --production
      npm run build
      echo "=== Build complete ==="

    # Run command - create .env, run migrations, start server
    # Note: Environment variables are available at runtime, not during build
    run_command: |
      echo "Creating .env file from environment variables..."
      cat > .env << EOF
      APP_NAME="${APP_NAME}"
      APP_ENV="${APP_ENV}"
      APP_KEY="${APP_KEY}"
      APP_DEBUG="${APP_DEBUG}"
      APP_URL="${APP_URL}"

      DB_CONNECTION="${DB_CONNECTION}"
      DB_HOST="${DB_HOST}"
      DB_PORT="${DB_PORT}"
      DB_DATABASE="${DB_DATABASE}"
      DB_USERNAME="${DB_USERNAME}"
      DB_PASSWORD="${DB_PASSWORD}"

      CACHE_DRIVER="${CACHE_DRIVER}"
      SESSION_DRIVER="${SESSION_DRIVER}"
      QUEUE_CONNECTION="${QUEUE_CONNECTION}"

      LOG_CHANNEL="${LOG_CHANNEL}"
      BROADCAST_DRIVER="${BROADCAST_DRIVER}"

      REQUIRE_HTTPS="${REQUIRE_HTTPS}"
      PDF_GENERATOR="${PDF_GENERATOR}"

      KITCHEN_PRINTER_ENABLED="${KITCHEN_PRINTER_ENABLED}"
      CLOUDPRNT_URL="${CLOUDPRNT_URL}"
      CLOUDPRNT_MAC="${CLOUDPRNT_MAC}"
      KITCHEN_PRINT_TEMPLATE="${KITCHEN_PRINT_TEMPLATE}"
      EOF
      echo ".env file created"
      php artisan module:enable KitchenPrinter || true
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force --no-interaction
      composer dump-autoload
      exec heroku-php-nginx -C nginx.conf public/

    environment_slug: php
    instance_count: 1
    instance_size_slug: professional-xs

    http_port: 8080

    routes:
      - path: /

    health_check:
      http_path: /
      initial_delay_seconds: 90
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables (set sensitive ones via dashboard)
    envs:
      - key: APP_NAME
        value: "Invoice Ninja"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Database connection (auto-populated from managed database)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ${dbaas-db-9899155.HOSTNAME}
      - key: DB_PORT
        value: ${dbaas-db-9899155.PORT}
      - key: DB_DATABASE
        value: ${dbaas-db-9899155.DATABASE}
      - key: DB_USERNAME
        value: ${dbaas-db-9899155.USERNAME}
      - key: DB_PASSWORD
        value: ${dbaas-db-9899155.PASSWORD}

      # Kitchen Printer Module (disabled by default)
      - key: KITCHEN_PRINTER_ENABLED
        value: "false"
      - key: CLOUDPRNT_URL
        value: ""
      - key: CLOUDPRNT_MAC
        value: ""
      - key: KITCHEN_PRINT_TEMPLATE
        value: "default"

      # Cache (use file driver for simplicity)
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # Laravel specific
      - key: LOG_CHANNEL
        value: stack
      - key: BROADCAST_DRIVER
        value: log

      # Invoice Ninja specific
      - key: REQUIRE_HTTPS
        value: "true"
      - key: PDF_GENERATOR
        value: snappdf

# Note: Set these via Digital Ocean dashboard:
# - APP_KEY (generate with: php artisan key:generate --show)
# - APP_URL (your domain or DO app URL)
# - MAIL_* variables
# - Any other production secrets
