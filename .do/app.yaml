name: invoice-ninja-production
region: sgp1

# Use existing managed MySQL database
databases:
  - name: dbaas-db-9899155
    engine: MYSQL
    production: true
    cluster_name: dbaas-db-9899155

# Main web service
services:
  - name: web
    github:
      repo: 88kbbq/invoiceninja
      branch: production
      deploy_on_push: true

    # Build command - install dependencies and build assets
    build_command: |
      echo "=== Starting build ==="
      composer install --no-dev --optimize-autoloader --no-interaction
      npm ci --production
      npm run build
      echo "=== Build complete ==="

    # Run command - create .env referencing environment variables, run migrations, start server
    # Note: Environment variables are available at runtime, not during build
    run_command: |
      echo "Creating .env file..."
      env | grep -E '^(APP_|DB_|CACHE_|SESSION_|QUEUE_|LOG_|BROADCAST_|REQUIRE_|PDF_|KITCHEN_|CLOUDPRNT_)' | while IFS='=' read -r key value; do
        # Properly quote values that contain spaces or special characters
        if [[ "$value" =~ [[:space:]] ]] || [[ "$value" =~ [\"\'\`\$] ]]; then
          echo "$key=\"$value\"" >> .env
        else
          echo "$key=$value" >> .env
        fi
      done
      echo ".env file created with $(wc -l < .env) variables"
      php artisan module:enable KitchenPrinter || true
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force --no-interaction --skip-schema-load
      composer dump-autoload
      exec heroku-php-nginx -C nginx.conf public/

    environment_slug: php
    instance_count: 1
    instance_size_slug: professional-xs

    http_port: 8080

    routes:
      - path: /

    health_check:
      http_path: /
      initial_delay_seconds: 90
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables (set sensitive ones via dashboard)
    envs:
      - key: APP_NAME
        value: "Invoice Ninja"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      # Database connection (auto-populated from managed database)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ${dbaas-db-9899155.HOSTNAME}
      - key: DB_PORT
        value: ${dbaas-db-9899155.PORT}
      - key: DB_DATABASE
        value: ${dbaas-db-9899155.DATABASE}
      - key: DB_USERNAME
        value: ${dbaas-db-9899155.USERNAME}
      - key: DB_PASSWORD
        value: ${dbaas-db-9899155.PASSWORD}

      # Application keys (REQUIRED)
      - key: APP_KEY
        value: "base64:gZovGEGy41IsfPvWi8c2/xavGG5dhdd56DOx2b3xUqw="
        type: SECRET
      - key: APP_URL
        value: "https://invoice-ninja-production-f3dqj.ondigitalocean.app"

      # Kitchen Printer Module (disabled by default)
      - key: KITCHEN_PRINTER_ENABLED
        value: "false"
      - key: CLOUDPRNT_URL
        value: ""
      - key: CLOUDPRNT_MAC
        value: ""
      - key: KITCHEN_PRINT_TEMPLATE
        value: "default"

      # Cache (use file driver for simplicity)
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # Laravel specific
      - key: LOG_CHANNEL
        value: stack
      - key: BROADCAST_DRIVER
        value: log

      # Invoice Ninja specific
      - key: REQUIRE_HTTPS
        value: "true"
      - key: PDF_GENERATOR
        value: snappdf

# Note: Set these via Digital Ocean dashboard:
# - APP_KEY (generate with: php artisan key:generate --show)
# - APP_URL (your domain or DO app URL)
# - MAIL_* variables
# - Any other production secrets
