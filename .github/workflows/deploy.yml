name: Deploy to Production Droplet

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH without webfactory action
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to droplet
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DROPLET_IP }} "sudo /usr/local/bin/deploy-invoice-ninja.sh"

      - name: Verify deployment
        run: |
          echo "Waiting 10 seconds for application to start..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://invoice.88k.com.tw/)
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Deployment verified successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Deployment verification failed (HTTP $HTTP_CODE)"
            exit 1
          fi
