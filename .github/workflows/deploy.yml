name: Deploy to Production Droplet

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to droplet..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DROPLET_IP }} "echo 'SSH connection successful'; whoami; pwd"

      - name: Check deployment script
        run: |
          echo "Checking if deployment script exists..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DROPLET_IP }} "ls -la /usr/local/bin/deploy-invoice-ninja.sh || echo 'Deployment script not found'"

      - name: Deploy to droplet
        run: |
          set -x
          echo "Starting deployment to droplet..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DROPLET_IP }} "sudo bash -x /usr/local/bin/deploy-invoice-ninja.sh" 2>&1
          DEPLOY_EXIT_CODE=$?
          echo "Deployment script exit code: $DEPLOY_EXIT_CODE"
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            echo "Deployment failed with exit code $DEPLOY_EXIT_CODE"
            exit $DEPLOY_EXIT_CODE
          fi

      - name: Verify deployment
        run: |
          echo "Waiting 10 seconds for application to start..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://invoice.88k.com.tw/)
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Deployment verified successfully (HTTP $HTTP_CODE)"
          else
            echo "❌ Deployment verification failed (HTTP $HTTP_CODE)"
            exit 1
          fi
