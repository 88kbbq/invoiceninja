name: Deploy to Production Droplet

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment..."
            sudo /usr/local/bin/deploy-invoice-ninja.sh
            echo "Deployment script completed with exit code: $?"

      - name: Verify deployment
        run: |
          echo "Waiting 30 seconds for application to start..."
          sleep 30

          # Try up to 5 times with 10 second intervals
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://invoice.88k.com.tw/)
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Deployment verified successfully (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i: Deployment not ready (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done

          echo "❌ Deployment verification failed after retries"
          exit 1
